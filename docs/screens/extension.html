<!doctype html>

<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>

<body>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #DDE1E7; padding: 24px; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #15171C">

<button type="button" aria-label="BandUp Lab 확장" style="width: 36px; height: 36px; border-radius: 8px; border: 2px solid #2F4FD8; background: #FFFFFF; color: #2F4FD8; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">B</button>

<div style="flex: 1; display: flex; gap: 40px; padding: 40px 48px; background: #FFFFFF">

<div style="width: 56%; height: 11px; border-radius: 4px; background: #ECEEF1"></div>
</div>
<div aria-hidden="true" style="flex: 1 1 0; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; gap: 10px">

<li style="display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F7A4D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>화면 스크린샷</li>
</ul>
<button type="button" style="min-height: 48px; border-radius: 10px; border: none; background: #2F4FD8; font: inherit; font-size: 15px; font-weight: 600; color: #FFFFFF; cursor: pointer">이 화면 가져오기</button>
<p style="margin: 0; font-size: 12px; color: #5F6673; line-height: 1.6">내 컴퓨터의 BandUp Lab으로만 보낸다. 채점 화면에서 한 번 더 누르면 정답도 채워진다.</p>
